# Automatic cache invalidation: when a database row changes, the cache
# entries built from it are invalidated. See docs/db-sync.md.
#
# Use this file in one of two ways:
#   - in cache-boy.conf:   db-sync /path/to/cache-boy-sync.yaml   (the server runs it)
#   - as a separate process:  cache-boy-sync -config cache-boy-sync.yaml
#
# ${VAR} is replaced with the environment variable VAR.

# The switch. Without `auto_invalidate: true` nothing is invalidated
# automatically, and your application invalidates the cache itself
# (TAG.INVALIDATE / DEL), exactly as before.
auto_invalidate: true

# Only used by the separate cache-boy-sync process.
cache:
  addr: 127.0.0.1:6380
  # username: sync
  # password: ${CACHEBOY_PASSWORD}
  # namespace: shop

sources:
  # --- PostgreSQL (needs wal_level = logical) ---
  - type: postgres
    url: postgres://cache_sync:${PG_PASSWORD}@127.0.0.1:5432/shop?sslmode=disable
    rules:
      - table: users                    # or schema.table
        tags: ["user:{id}", "users:list"]
      - table: orders
        tags: ["user:{user_id}", "order:{id}"]
        keys: ["order:{id}:summary"]
        # on: [insert, update, delete, truncate]   # default: all
    # Tags from non-key columns (orders.user_id) need the old row on
    # UPDATE/DELETE:  ALTER TABLE orders REPLICA IDENTITY FULL;

  # --- MySQL (needs binlog_format = ROW, binlog_row_image = FULL) ---
  # - type: mysql
  #   url: mysql://cache_sync:${MYSQL_PASSWORD}@127.0.0.1:3306/shop
  #   rules:
  #     - table: products              # or database.table
  #       tags: ["product:{id}", "category:{category_id}"]

  # --- MongoDB (needs a replica set) ---
  # - type: mongodb
  #   url: mongodb://127.0.0.1:27017/?replicaSet=rs0
  #   database: shop
  #   rules:
  #     - collection: posts
  #       tags: ["post:{_id}", "author:{author.id}"]
