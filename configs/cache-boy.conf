# cache-boy configuration. Every option can also be passed as a flag:
#   cache-boy configs/cache-boy.conf --port 7000 --maxmemory 256mb

# --- network ---
bind 127.0.0.1
port 6380
# REST API, WebSocket and dashboard (0 disables)
http-port 6381
# requirepass change-me
maxclients 10000
# close idle clients after N seconds (0 = never)
timeout 0

# --- memory ---
# maxmemory 512mb
# noeviction | allkeys-lru | allkeys-lfu | allkeys-tinylfu | allkeys-random | volatile-lru | volatile-lfu | volatile-tinylfu | volatile-random | volatile-ttl
maxmemory-policy noeviction
maxmemory-samples 5
# compress string values of at least this many bytes (0 = off)
compression-threshold 0

# --- persistence ---
dir .
dbfilename dump.cbdump
# snapshot after <seconds> if at least <changes> writes happened
save 3600 1 300 100 60 10000
appendonly no
appendfilename appendonly.aof
# always | everysec | no
appendfsync everysec

# --- features ---
# versions kept per string key for HISTORY / GETVERSION (0 = off)
history-depth 0
script-timeout 5000

# --- replication ---
# replicaof 10.0.0.1 6380
# masterauth <leader password>
# masteruser <ACL user, if not default>

# --- cluster (static slot map) ---
# cluster-enabled yes
# cluster-node-id node-a
# cluster-node node-a 10.0.0.1:6380 0-8191
# cluster-node node-b 10.0.0.2:6380 8192-16383

# --- automatic failover (Raft leader election) ---
# raft-port 7380
# raft-peer node-a 10.0.0.1:7380 10.0.0.1:6380
# raft-peer node-b 10.0.0.2:7380 10.0.0.2:6380
# raft-peer node-c 10.0.0.3:7380 10.0.0.3:6380

# --- observability ---
# log commands slower than N microseconds (-1 disables)
slowlog-log-slower-than 10000
slowlog-max-len 128
hz 10
